name: render-video
on:
  push:
    branches: [claude/project-thread-dik3h8]
    paths: ['render/jobs.txt']
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.p.outputs.m }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "m=$(python3 -c "import json;print(json.dumps([l.strip() for l in open('render/jobs.txt') if l.strip()]))")" >> $GITHUB_OUTPUT
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxrender1 libxxf86vm1 libxfixes3
      - run: pip install -q bpy==5.3.0 numpy
      - name: render
        run: |
          set -- ${{ matrix.chunk }}
          mkdir -p frames
          RES=1080x608 SAMP=16 python render/shots2.py $1 anim frames $2 $3 | grep -E "Saved|Error|Traceback" || true
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ strategy.job-index }}
          path: frames
          retention-days: 3
  collect:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: frames
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: encode
        run: |
          mkdir -p render/out
          for d in frames/*/; do
            s=$(basename $d)
            ls $d | wc -l > render/out/$s.count
            ffmpeg -v error -y -framerate 24 -pattern_type glob -i "$d/f_*.png" -c:v libx264 -preset slow -crf 9 -pix_fmt yuv420p render/out/$s.mp4
          done
      - name: push
        run: |
          git config user.name "asadalsyed29-create"
          git config user.email "asadalsyed29@gmail.com"
          git add render/out
          git commit -m "Rendered video shots [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
