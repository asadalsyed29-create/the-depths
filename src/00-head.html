<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1519">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Depths</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1519;color:#dfe6e8;font-family:Roboto,"Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:rgba(16,26,31,.9);border:1px solid rgba(150,180,190,.35);padding:9px 14px;cursor:pointer;touch-action:manipulation}
button:hover{background:rgba(30,46,54,.95)}
button:active{background:rgba(50,70,80,.95)}
button.on{border-color:#8fd0d8;color:#e9fbff;background:rgba(36,64,72,.95)}
button:disabled{opacity:.4;cursor:default}
#hud{position:fixed;inset:0;pointer-events:none}
#obj{position:absolute;left:calc(12px + env(safe-area-inset-left));top:10px;max-width:38%;font-size:13px;line-height:1.35;background:rgba(8,14,18,.6);border-left:2px solid #8fd0d8;padding:6px 10px}
#obj b{display:block;font-size:10px;letter-spacing:.14em;color:#8fd0d8;font-weight:500;margin-bottom:2px}
#res{position:absolute;right:calc(64px + env(safe-area-inset-right));top:10px;font-size:12px;background:rgba(8,14,18,.6);padding:6px 10px;display:flex;gap:12px;white-space:nowrap}
#res span i{font-style:normal;color:#93a4aa;margin-right:4px}
#bars{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:14px;font-size:11px;background:rgba(8,14,18,.55);padding:6px 10px}
.bar{width:110px}.bar .l{display:flex;justify-content:space-between;color:#a8b8bd;margin-bottom:3px}
.bar .t{height:5px;background:rgba(255,255,255,.12)}.bar .f{height:100%;background:#8fd0d8;width:50%}
#map{position:absolute;right:calc(12px + env(safe-area-inset-right));top:44px;width:170px;height:170px;background:rgba(6,12,15,.7);border:1px solid rgba(150,180,190,.25)}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:14px;background:rgba(8,14,18,.72);padding:6px 12px;white-space:nowrap}
#prompt:empty{display:none}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:rgba(230,240,240,.8)}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:14px;text-align:center;transition:opacity .4s;opacity:0;background:rgba(8,14,18,.7);padding:7px 14px}
#warn{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-size:13px;letter-spacing:.12em;color:#ff8a70;text-align:center}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.95) 100%);opacity:0}
#static{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;mix-blend-mode:screen;image-rendering:pixelated}
#compass{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:12px;background:rgba(8,14,18,.6);padding:5px 10px;display:flex;align-items:center;gap:8px}
#compass canvas{width:22px;height:22px}
#hint{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-size:13px;color:#b8c8cc;background:rgba(8,14,18,.6);padding:6px 12px}
#touch{position:fixed;inset:0}
#joy{position:absolute;width:130px;height:130px;border-radius:50%;border:1px solid rgba(200,220,225,.3);background:rgba(10,20,24,.25);pointer-events:none;left:calc(40px + env(safe-area-inset-left));bottom:30px}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(200,225,230,.35)}
.tb{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(14,24,28,.55);border:1px solid rgba(200,220,225,.35);display:flex;align-items:center;justify-content:center;font-size:12px;padding:0;color:#e4eef0}
.tb.big{width:80px;height:80px;font-size:14px}
.tb.sq{border-radius:0;width:auto;height:34px;padding:0 12px;font-size:12px}
.tb.held{background:rgba(80,120,130,.6)}
#dlg{z-index:20;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,94vw);background:rgba(8,14,18,.92);border:1px solid rgba(150,180,190,.3);padding:12px 16px}
#dlg .who{font-size:15px;color:#8fd0d8}#dlg .who small{color:#8a9aa0;font-size:12px;margin-left:8px}
#dlg .txt{font-size:15px;line-height:1.45;margin:6px 0 10px;min-height:2.9em}
#dlg .ch{display:flex;flex-wrap:wrap;gap:6px}
#dlg .ch button{font-size:13px;padding:8px 12px;text-align:left}
#panel{z-index:20;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);max-height:90vh;display:flex;flex-direction:column;background:rgba(8,14,18,.95);border:1px solid rgba(150,180,190,.3)}
#panel .ph{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(150,180,190,.2);font-size:16px}
#panel .ph button{padding:6px 12px}
#panel .pb{overflow:auto;padding:12px 14px;font-size:14px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(150,180,190,.12)}
.row .d{flex:1}.row .d small{display:block;color:#8a9aa0;font-size:12px;margin-top:2px}
.cost{font-size:12px;color:#b8c4c8;white-space:nowrap}.cost .no{color:#e07a6a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.lbl{color:#93a4aa;font-size:12px;letter-spacing:.08em;margin:10px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
input[type=range]{width:100%;accent-color:#8fd0d8}
#title{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding-left:max(7vw,calc(24px + env(safe-area-inset-left)));background:linear-gradient(90deg,rgba(5,10,12,.85),rgba(5,10,12,.2) 60%,rgba(5,10,12,0))}
#title h1{font-weight:300;font-size:clamp(30px,6vh,60px);letter-spacing:.32em;color:#e8f2f3}
#title p{color:#8fa4aa;font-size:12px;letter-spacing:.16em;margin:4px 0 16px}
#title .menu{display:flex;flex-direction:column;gap:6px;width:250px}
#title .menu button{text-align:left;padding:9px 16px}
#title .opts{margin-top:12px;width:250px;font-size:13px}
#title .opts .lbl{margin-top:0}
#fade{z-index:40;position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#rotate{position:fixed;inset:0;background:#0a1519;display:none;align-items:center;justify-content:center;font-size:16px;color:#cfdcdf;text-align:center;padding:30px;z-index:50}
@media (orientation:portrait){body.mobile #rotate{display:flex}}
#over{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.82);font-size:15px;text-align:center;padding:20px}
#over h2{font-weight:300;letter-spacing:.2em;font-size:28px}
body.mobile #res{right:calc(250px + env(safe-area-inset-right));font-size:11px;gap:8px;padding:5px 8px}
body.mobile #obj{max-width:33%;font-size:12px}
body.mobile #map{width:136px;height:136px;top:52px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a1519;color:#8fa4aa;font-size:13px;letter-spacing:.2em;z-index:60}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="vign"></div><canvas id="static" width="160" height="90"></canvas>
  <div id="obj"></div>
  <div id="res"></div>
  <canvas id="map" width="170" height="170" class="hidden"></canvas>
  <div id="compass" class="hidden"><canvas id="cmp" width="44" height="44"></canvas><span id="cmpT"></span></div>
  <div id="warn"></div>
  <div id="bars"></div>
  <div id="prompt"></div>
  <div id="cross"></div>
  <div id="toast"></div>
  <div id="hint" class="hidden">Arrow keys to look around, or click to use the mouse</div>
</div>
<div id="touch" class="hidden"><div id="joy"><div id="knob"></div></div><div id="tbs"></div></div>
<div id="dlg" class="hidden"><div class="who"></div><div class="txt"></div><div class="ch"></div></div>
<div id="panel" class="hidden"><div class="ph"><span class="pt"></span><button class="pc">Close</button></div><div class="pb"></div></div>
<div id="over" class="hidden"></div>
<div id="title" class="hidden">
  <h1>THE DEPTHS</h1><p>A MOTHERSHIP IN THE FOG</p>
  <div class="menu" id="tmenu"></div>
  <div class="opts" id="topts"></div>
</div>
<div id="fade"></div>
<div id="rotate">Turn your phone sideways to play.</div>
<div id="load">LOADING</div>
